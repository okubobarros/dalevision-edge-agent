name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      DALE_VISION_MODEL_URL: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[vision]"
          python -m pip install pyinstaller

      - name: Verify vision runtime deps
        run: |
          python -c "import cv2, numpy, ultralytics; print('vision deps ok')"

      - name: Sanity check spec
        shell: pwsh
        run: |
          Write-Host "PWD:" (Get-Location)
          Write-Host "Repo root contents:"
          Get-ChildItem -Force
          Write-Host "Spec files:"
          $specs = Get-ChildItem -Recurse -Filter *.spec
          $specs | ForEach-Object { Write-Host " - $($_.FullName)" }
          if (-not (Test-Path ".\dalevision-edge-agent.spec")) {
            throw "Spec file not found: .\dalevision-edge-agent.spec"
          }

      - name: Build executable
        run: |
          pyinstaller .\dalevision-edge-agent.spec

      - name: Package ZIP
        run: |
          .\scripts\release_windows.ps1 -Version $env:GITHUB_REF_NAME

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Setup EXE
        shell: pwsh
        run: |
          .\scripts\build_setup_installer.ps1 -Version $env:GITHUB_REF_NAME -SourceDir ".\release\win" -OutputDir "."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dalevision-edge-agent-windows.zip
            DaleVisionEdgeSetup-*.exe
          name: ${{ github.ref_name }}
          generate_release_notes: true
